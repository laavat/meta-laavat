# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "laavat"
BBFILE_PATTERN_laavat = "^${LAYERDIR}/"
BBFILE_PRIORITY_laavat = "6"
# Bumped when a change here requires a matching change in a layer that depends on this one.
LAYERVERSION_laavat = "3"

# core for the classes themselves, meta-python for python3-jwcrypto's runtime deps.
LAYERDEPENDS_laavat = "core meta-python"

# Not dependencies: a class is only parsed if a recipe inherits it, and no build needs
# all of them. Declaring these hard would force meta-rauc on a build that only signs a
# FIT. Recommended instead, so `bitbake-layers show-layers` and any resolver can see the
# relationship that the runtime errors already name:
#   laavat-rauc, laavat-rauc-keyring   meta-rauc      (bundle.bbclass, RAUC_*)
#   laavat-bootgen                     meta-xilinx    (xilinx-bootbin, BOOTGEN_ARCH)
#   laavat-optee                       whichever layer provides optee-os for your BSP
#                                      (meta-arm, meta-freescale or meta-ti)
LAYERRECOMMENDS_laavat = "meta-rauc meta-xilinx"
LAYERSERIES_COMPAT_laavat = "scarthgap styhead walnascar whinlatter wrynose"
